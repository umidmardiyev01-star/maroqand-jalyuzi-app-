<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maroqand Jalyuzi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --primary: #228B22;
            --primary-dark: #006400;
            --secondary: #1a1a1a;
            --bg: #f8f9fa;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #228B22 0%, #006400 100%);
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        
        .logo-container {
            width: 50px;
            height: 50px;
            margin: 0 auto 10px;
        }
        
        .logo {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.5);
        }
        
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .header h1 { 
            font-size: 22px; 
            margin-bottom: 3px; 
            font-weight: 700; 
        }
        
        .header p { 
            opacity: 0.9; 
            font-size: 12px; 
        }
        
        .container { padding: 25px 20px; max-width: 600px; margin: 0 auto; }
        
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .products {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }
        
        .product {
            background: white;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .product:hover, .product:active {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(34,139,34,0.15);
        }
        
        .product-icon { font-size: 40px; margin-bottom: 12px; display: block; }
        .product h3 { font-size: 15px; color: var(--primary); margin-bottom: 6px; font-weight: 600; }
        .product p { font-size: 12px; color: #666; }
        
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px 0;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(34,139,34,0.3);
        }
        
        .btn-secondary { background: var(--secondary); color: white; }
        
        .contact {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        
        .contact h2 { color: var(--primary); margin-bottom: 20px; font-size: 18px; }
        
        .contact-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        
        .contact-icon { font-size: 20px; margin-right: 15px; width: 40px; height: 40px; background: #e8f5e9; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        
        .contact-text { flex: 1; }
        .contact-label { font-size: 12px; color: #999; margin-bottom: 2px; }
        .contact-value { font-size: 15px; font-weight: 500; color: var(--secondary); }
        
        .footer { text-align: center; padding: 30px 20px; color: #999; font-size: 12px; }
    </style>  <!-- BU YERDA YOPILISHI KERAK -->
</head>
<body>
