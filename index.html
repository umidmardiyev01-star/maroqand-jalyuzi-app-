<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maroqand Jalyuzi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #228B22 0%, #006400 100%);
            color: white;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        .logo {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .header h1 { font-size: 20px; }
        
        /* Container */
        .container { padding: 15px; max-width: 500px; margin: 0 auto; padding-bottom: 80px; }
        
        /* Pages */
        .page { display: none; }
        .page.active { display: block; }
        
        /* Home Page */
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 10px;
            color: #228B22;
        }
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .category-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 2px solid transparent;
            cursor: pointer;
        }
        .category-card:active { border-color: #228B22; }
        .category-icon { font-size: 36px; margin-bottom: 8px; }
        .category-name { font-size: 14px; font-weight: bold; color: #228B22; }
        
        /* Order Form */
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .order-header h2 { font-size: 20px; }
        .draft-btn {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
        }
        
        .product-card {
            background: white;
            border-radius: 15px;
            border: 2px solid #FFD700;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .product-header {
            background: #f8f8f8;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .product-header h3 { font-size: 16px; }
        .arrow { font-size: 20px; color: #666; }
        
        .product-body {
            padding: 15px;
            display: none;
        }
        .product-body.active { display: block; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group select,
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            background: white;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .add-size-btn {
            width: 100%;
            padding: 12px;
            border: 2px dashed #228B22;
            background: white;
            border-radius: 10px;
            color: #228B22;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item {
            color: #888;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .nav-item.active { color: #FFD700; }
        .nav-icon { font-size: 24px; }
        
        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #228B22 0%, #006400 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        
        /* Category Dropdown */
        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }
        .dropdown-menu.active { display: block; }
        .dropdown-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .dropdown-item:hover { background: #f0f8f0; }
        .dropdown-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div class="header">
        <button class="back-btn" id="backBtn" onclick="goBack()" style="display: none;">←</button>
        <div class="logo">🪟</div>
        <h1 id="pageTitle">Maroqand Jalyuzi</h1>
    </div>

    <div class="container">
        
        <!-- ASOSIY SAHIFA -->
        <div id="homePage" class="page active">
            <div class="section-title">Kategoriyalar</div>
            <div class="category-grid">
                <div class="category-card" onclick="showOrderForm()">
                    <div class="category-icon">🛒</div>
                    <div class="category-name">Buyurtma berish</div>
                </div>
                <div class="category-card" onclick="contact()">
                    <div class="category-icon">📞</div>
                    <div class="category-name">Bog'lanish</div>
                </div>
                <div class="category-card" onclick="showPage('products')">
                    <div class="category-icon">📋</div>
                    <div class="category-name">Mahsulotlar</div>
                </div>
                <div class="category-card" onclick="showPage('about')">
                    <div class="category-icon">ℹ️</div>
                    <div class="category-name">Biz haqimizda</div>
                </div>
            </div>
        </div>

        <!-- BUYURTMA FORMASI -->
        <div id="orderPage" class="page">
            <div class="order-header">
                <h2>← Buyurtma yaratish</h2>
                <button class="draft-btn">Qoralamalar</button>
            </div>

            <form id="orderForm">
                <div class="product-card">
                    <div class="product-header" onclick="toggleProduct(this)">
                        <h3>Mahsulot 1</h3>
                        <span class="arrow">▲</span>
                    </div>
                    <div class="product-body active">
                        <div class="form-row">
                            <div class="form-group">
                                <label>Kategoriya</label>
                                <select id="category" onchange="updateSubcategory()">
                                    <option value="">Tanlang</option>
                                    <option value="combo">Kombo</option>
                                    <option value="bezplanki">Bez planki</option>
                                    <option value="plisse">Plisse</option>
                                    <option value="rollo">Rollo</option>
                                    <option value="rollo-shtori">Rollo Shtori</option>
                                    <option value="rimskiy">Rimskiy</option>
                                    <option value="evro">Evro</option>
                                    <option value="masketniy">Masketniy</option>
                                    <option value="honeycomb">Honeycomb</option>
                                    <option value="derevyanniy">Derevyanniy</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Subkategoriya</label>
                                <select id="subcategory">
                                    <option value="">Tanlang</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Kod</label>
                            <select>
                                <option value="">Mahsulot kodini tanlang</option>
                                <option value="001">001 - Standart</option>
                                <option value="002">002 - Premium</option>
                                <option value="003">003 - Ekonom</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>O'lchamlar</label>
                            <select>
                                <option value="">O'lcham 1</option>
                                <option value="100x150">100 x 150 cm</option>
                                <option value="120x160">120 x 160 cm</option>
                                <option value="150x200">150 x 200 cm</option>
                                <option value="custom">Boshqa</option>
                            </select>
                        </div>

                        <button type="button" class="add-size-btn">+ O'lcham qo'shish</button>

                        <div class="form-group">
                            <label>Izoh</label>
                            <textarea placeholder="Izohingizni qoldiring"></textarea>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Buyurtma berish</button>
            </form>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active" onclick="showPage('home')">
            <span class="nav-icon">🏠</span>
            <span>Asosiy</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🛒</span>
            <span>Savat</span>
        </a>
        <a href="#" class="nav-item" onclick="showOrderForm()">
            <span class="nav-icon" style="background: #FFD700; color: #1a1a1a; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-top: -20px; font-size: 28px;">+</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Buyurtmalar</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Profil</span>
        </a>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        
        tg.MainButton.text = "Buyurtma berish";
        tg.MainButton.color = "#228B22";
        tg.MainButton.hide();

        const subcategories = {
            'combo': ['Vertikal + Gorizontal', 'Plisse + Rollo', 'Evro + Rimskiy'],
            'bezplanki': ['Standart', 'Premium', 'Ekonom'],
            'plisse': ['Oddiy', 'Yomg\'irga chidamli', 'Tungi', 'Quyosh nurlariga'],
            'rollo': ['Zanjirli', 'Elektr', 'Smart', 'Qo\'l bilan'],
            'rollo-shtori': ['Derevyan', 'Plastik', 'Metall'],
            'rimskiy': ['Klassik', 'Zamonaviy', 'Premium'],
            'evro': ['Standart', 'Keng', 'Tor'],
            'masketniy': ['To'liq', 'Yarim', 'Maxsus'],
            'honeycomb': ['Yagona', 'Ikki qatlamli', 'Uch qatlamli'],
            'derevyanniy': ['Qora', 'Oq', 'Tabiiy', 'Qizil']
        };

        function showPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(page + 'Page').classList.add('active');
            
            if (page === 'home') {
                document.getElementById('backBtn').style.display = 'none';
                document.getElementById('pageTitle').textContent = 'Maroqand Jalyuzi';
            }
        }

        function showOrderForm() {
            showPage('order');
            document.getElementById('backBtn').style.display = 'block';
            document.getElementById('pageTitle').textContent = 'Buyurtma';
        }

        function goBack() {
            showPage('home');
        }

        function toggleProduct(header) {
            const body = header.nextElementSibling;
            const arrow = header.querySelector('.arrow');
            body.classList.toggle('active');
            arrow.textContent = body.classList.contains('active') ? '▲' : '▼';
        }

        function updateSubcategory() {
            const category = document.getElementById('category').value;
            const subSelect = document.getElementById('subcategory');
            subSelect.innerHTML = '<option value="">Tanlang</option>';
            
            if (subcategories[category]) {
                subcategories[category].forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub;
                    option.textContent = sub;
                    subSelect.appendChild(option);
                });
            }
        }

        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            tg.showAlert('Buyurtma qabul qilindi!');
            tg.sendData('Yangi buyurtma');
        });

        function contact() {
            tg.openLink('tel:+998976600055');
        }
    </script>
</body>
</html>
